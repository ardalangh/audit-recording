<!doctype html>
<!-- Pebblebook: a fictional notes app used only to demo the audit-recording skill.
     The issues in it are planted on purpose. Open with ?s=form|tap|saved|settings. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:390px;height:844px;font:15px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",sans-serif;color:#1d1b19;background:#f6f3ee;position:relative;overflow:hidden}
  .status{height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-weight:600;font-size:15px}
  .bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
  .bar h1{font-size:17px;font-weight:600}
  .ic{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;font-size:22px;color:#1d1b19}
  .avatar{width:84px;height:84px;border-radius:42px;background:#e0b98a;margin:18px auto 8px;display:grid;place-items:center;font-size:30px;font-weight:700;color:#5b3a12}
  .change{text-align:center;color:#2f6b4f;font-weight:600;font-size:14px;margin-bottom:18px}
  .card{background:#fff;border-radius:14px;margin:0 16px 14px;padding:4px 16px}
  .row{padding:12px 0;border-bottom:1px solid #eee9e1}.row:last-child{border:0}
  .lab{font-size:12px;color:#7a736b;margin-bottom:2px}
  .val{font-size:16px}
  .help{font-size:12px;color:#cfcac3;margin:-6px 32px 16px}
  .save{position:absolute;left:16px;right:16px;bottom:44px;height:52px;border-radius:14px;background:#2f6b4f;color:#fff;font-weight:600;font-size:17px;display:grid;place-items:center}
  .touch{position:absolute;left:170px;bottom:52px;width:40px;height:40px;border-radius:20px;background:rgba(120,120,120,.55);border:2px solid rgba(255,255,255,.8)}
  .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;background:#1d1b19;color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;white-space:nowrap}
  .list .row{display:flex;justify-content:space-between;align-items:center;font-size:16px}
  .chev{color:#b5aea5}
  .section{font-size:12px;color:#7a736b;margin:8px 32px 6px;text-transform:uppercase;letter-spacing:.04em}
  .tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid #eee9e1;display:flex;justify-content:space-around;padding-top:12px;font-size:24px;color:#9c958c}
  .tabs .on{color:#2f6b4f}
  .home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:#1d1b19;transform:translateX(-50%)}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<div id="root"></div>
<div class="home"></div>
<script>
const s = new URLSearchParams(location.search).get('s') || 'form';
const profile = `
  <div class="bar"><div class="ic">‹</div><h1>Profile</h1><div class="ic"> </div></div>
  <div class="avatar">AE</div><div class="change">Change photo</div>
  <div class="card">
    <div class="row"><div class="lab">Name</div><div class="val">Alex Example</div></div>
    <div class="row"><div class="lab">Email</div><div class="val">alex@example.com</div></div>
    <div class="row"><div class="lab">Bio</div><div class="val">Writes things down so they stop rattling around.</div></div>
  </div>
  <div class="help">Your name and bio are shown on notes you share.</div>
  <div class="save">Save</div>`;
const settings = `
  <div class="bar"><div class="ic"> </div><h1>Settings</h1><div class="ic"> </div></div>
  <div class="section">You</div>
  <div class="card list">
    <div class="row"><span>Account</span><span class="chev">›</span></div>
    <div class="row"><span>Notifications</span><span class="chev">›</span></div>
    <div class="row"><span>Appearance</span><span class="chev">›</span></div>
  </div>
  <div class="section">Notes</div>
  <div class="card list">
    <div class="row"><span>Sync</span><span class="chev">›</span></div>
    <div class="row"><span>Export</span><span class="chev">›</span></div>
  </div>
  <div class="tabs"><span>⌂</span><span>✎</span><span>⌕</span><span class="on">⚙</span></div>`;
const html = {
  form: profile,
  tap: profile + '<div class="touch"></div>',
  saved: profile + '<div class="toast">Account updated</div>',
  settings: settings,
}[s];
document.getElementById('root').innerHTML = html;
</script>
</body></html>
